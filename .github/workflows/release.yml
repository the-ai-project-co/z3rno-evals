name: Release

# v0.19.9 — fires on every ``v*.*.*`` tag push. Mirrors the
# z3rno-sdk-python + z3rno-mcp pattern: build sdist + wheel with
# ``uv build``, then publish via the trusted-publishers OIDC flow.
#
# Requires ``PYPI_API_TOKEN`` repository secret + a registered
# project on pypi.org claiming the ``z3rno-evals`` name.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
